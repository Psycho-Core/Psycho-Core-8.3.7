# ===========================================================================
# Psycho_Core portable MariaDB/MySQL config TEMPLATE
# ===========================================================================
# MariaDB's installer creates its own file here:
#
#   mysql\data\my.ini
#
# The generated one may not be portable. The Psycho_Core helper scripts replace
# it by copying this file to:
#
#   mysql\data\my.ini
#
# Active runtime config used by the scripts:
#
#   mysqld.exe --defaults-file=../data/my.ini --console
#
# The scripts run from mysql\bin, so paths below are relative to mysql\bin.
# ===========================================================================

[client]
port=3306
host=127.0.0.1
default-character-set=utf8mb4

[mysql]
default-character-set=utf8mb4

[mysqld]
# Network
port=3306
bind-address=127.0.0.1

# Portable paths. These resolve from mysql\bin when using the helper scripts.
basedir=..
datadir=../data
tmpdir=../tmp
plugin-dir=../lib/plugin

# Logs / PID
log-error=../logs/mysql-error.log
pid-file=../data/mysql.pid

# Character set
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci

# Engine / compatibility
default-storage-engine=InnoDB
innodb_file_per_table=1
max_allowed_packet=128M
sql_mode=NO_ENGINE_SUBSTITUTION

# Useful defaults for a private local game server DB.
skip-name-resolve

# If you want LAN/Internet database access, change bind-address above to 0.0.0.0
# and open your firewall. For normal local server use, keep 127.0.0.1.
